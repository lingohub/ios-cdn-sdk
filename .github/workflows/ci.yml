name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Build (strict concurrency)
        run: swift build -Xswiftc -strict-concurrency=complete
      - name: Test
        run: swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices[] | .[] | select(.isAvailable) | select(.name | startswith("iPhone"))] | .[0].udid')
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme Lingohub \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  api-diff:
    name: Public API diff
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    # Informational while 2.0 is being assembled; make this job blocking
    # (remove continue-on-error) once v2.0.0 is tagged, so unintended changes
    # to the public API surface fail the PR.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose API breaking changes vs merge base
        run: |
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "Comparing against merge base $BASE"
          swift package diagnose-api-breaking-changes "$BASE"

  swift6-mode:
    name: Swift 6 language mode (tracking)
    runs-on: macos-15
    # ZIPFoundation 0.9.x contains concurrency-unsafe mutable globals that fail
    # under the Swift 6 language mode. This job tracks when the dependency (and
    # our own code) becomes Swift-6-clean; it never blocks a merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build in Swift 6 mode
        run: swift build -Xswiftc -swift-version -Xswiftc 6
