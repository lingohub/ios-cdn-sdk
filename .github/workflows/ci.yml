name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-macos:
    name: Build & test (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      # Swift and SwiftUI lookups are served through Bundle.lingohub, never by hooking
      # the private Foundation methods those APIs use internally: that would risk App
      # Review, and the names change between OS releases.
      - name: No private localization selectors in the SDK binary
        run: |
          OBJECT=$(find .build \( -name 'LingoHubSDK.o' -o -name 'LingoHubSDK.swift.o' \) | head -n 1)
          if [ -z "$OBJECT" ]; then
            echo "::error::SDK object files not found"
            exit 1
          fi
          OBJECTS_DIR=$(dirname "$OBJECT")
          # These must be the SDK's objects: the public selector swizzling intercepts is in them
          if ! grep -a -q -F 'localizedStringForKey:value:table:' "$OBJECTS_DIR"/*.o; then
            echo "::error::Swizzled selector not found in $OBJECTS_DIR"
            exit 1
          fi
          if grep -a -l -F \
              -e '_localizedStringForKey:value:table:localizations:' \
              -e 'localizedAttributedStringForKey:value:table:localization:' \
              -e '_localizedStringNoCacheNoMarkdownParsingForKey:' \
              "$OBJECTS_DIR"/*.o; then
            echo "::error::The SDK references a private Foundation localization selector"
            exit 1
          fi
      # SDK sources must be completely free of strict-concurrency diagnostics —
      # these are the warnings that become errors in the Swift 6 language mode.
      # This step fails on any SDK warning; the swift6-mode job below compiles
      # the SDK sources in that mode and fails on its errors.
      - name: Build (strict concurrency, no SDK warnings)
        run: |
          set -o pipefail
          swift build -Xswiftc -strict-concurrency=complete 2>&1 | tee strict-build.log
          if grep -E "Sources/Lingohub/.*warning" strict-build.log; then
            echo "::error::SDK sources produce strict-concurrency warnings (errors under Swift 6)"
            exit 1
          fi
      - name: Test
        run: swift test

  test-ios:
    name: Test (iOS Simulator)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available --json | jq -r '[.devices[] | .[] | select(.isAvailable) | select(.name | startswith("iPhone"))] | .[0].udid')
          echo "Selected simulator: $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - name: Test
        run: |
          xcodebuild test \
            -scheme Lingohub \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -skipMacroValidation \
            CODE_SIGNING_ALLOWED=NO

  api-diff:
    name: Public API diff
    if: github.event_name == 'pull_request'
    runs-on: macos-15
    # Blocking since v2.0.0: an unintended change to the public API surface
    # fails the PR. Intentional breaks belong in a major release, reviewed
    # against this job's output.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Diagnose API breaking changes vs merge base
        run: |
          BASE=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          echo "Comparing against merge base $BASE"
          swift package diagnose-api-breaking-changes "$BASE"

  swift6-mode:
    name: Swift 6 language mode (SDK sources)
    runs-on: macos-15
    # Compiles the SDK's own sources in the Swift 6 language mode, while the
    # dependencies keep the mode their manifests declare, as in apps that use
    # the SDK. `swift build -Xswiftc -swift-version -Xswiftc 6` would apply
    # Swift 6 to every module and stop in ZIPFoundation 0.9.x (Swift 5 mode,
    # mutable globals) before reaching any SDK source.
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build
      - name: Compile SDK sources in Swift 6 mode
        run: |
          set -o pipefail
          # Where the module lands in .build depends on SwiftPM's build system
          # (native on this runner, swiftbuild on newer toolchains).
          ZIP_MODULE=$(find .build -name ZIPFoundation.swiftmodule -print -quit)
          if [ -z "$ZIP_MODULE" ]; then
            echo "::error::ZIPFoundation.swiftmodule not found in .build"
            exit 1
          fi
          # -emit-sil rather than -typecheck: data-race errors from region-based
          # isolation are diagnosed in SIL, after type checking. -wmo makes it a
          # single compile job, whose one output is discarded. macOS 12 is the
          # package's minimum platform.
          status=0
          xcrun swiftc -emit-sil -wmo -o /dev/null -swift-version 6 \
            -sdk "$(xcrun --sdk macosx --show-sdk-path)" \
            -target "$(uname -m)-apple-macos12.0" \
            -I "$(dirname "$ZIP_MODULE")" \
            -module-name Lingohub -parse-as-library \
            $(find Sources/Lingohub -name '*.swift') 2>&1 | tee swift6.log || status=$?
          if [ "$status" -ne 0 ] || grep -q "error:" swift6.log; then
            echo "::error::SDK sources do not compile in the Swift 6 language mode"
            exit 1
          fi
